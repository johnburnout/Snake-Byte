name: Build Snake Byte Executables

on:
  # Déclenchement manuel depuis l'interface GitHub
  workflow_dispatch:
  # Déclenchement automatique quand on pousse un tag (ex: v1.0.0)
  push:
    tags:
      - 'v*'

jobs:
  # ---- Job de construction ----
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        # Pour ajouter Linux, décommentez la ligne suivante :
        # os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # Pas de requirements.txt car il est vide

      - name: Construire l'exécutable avec PyInstaller
        run: |
          pyinstaller --onefile --name "Snake-Byte" --windowed --add-data "images:images" main.py
          # --windowed : empêche l'ouverture d'une console (mode graphique)
          # --add-data : embarque les images dans l'exécutable (séparateur ':' accepté partout depuis PyInstaller 6)

      - name: Renommer l'exécutable selon la plateforme
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            mv dist/Snake-Byte.exe dist/Snake-Byte-Windows.exe
          elif [ "$RUNNER_OS" == "macOS" ]; then
            mv dist/Snake-Byte dist/Snake-Byte-macOS
          fi

      - name: Télécharger l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Byte-${{ runner.os }}
          path: dist/Snake-Byte-*

  # ---- Job de création de Release (optionnel) ----
  release:
    needs: build
    runs-on: ubuntu-latest
    # Ne s'exécute que si le workflow a été déclenché par un tag
    if: startsWith(github.ref, 'refs/tags/')
    # Nécessaire pour que GITHUB_TOKEN puisse créer la Release
    permissions:
      contents: write
    steps:
      - name: Récupérer tous les artefacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Lister les fichiers téléchargés
        run: ls -R artifacts

      - name: Créer une Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Snake-Byte-macOS/Snake-Byte-macOS
            artifacts/Snake-Byte-Windows/Snake-Byte-Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
