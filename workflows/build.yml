name: Build Executables

# Déclenchement du workflow
on:
  # Manuellement depuis l'interface GitHub
  workflow_dispatch:
  # Automatiquement quand on pousse un tag (comme v1.0.0)
  push:
    tags:
      - 'v*'

jobs:
  build:
    # Stratégie pour construire sur plusieurs systèmes d'exploitation
    strategy:
      matrix:
        os: [macos-latest, windows-latest] # Seulement Mac et Windows
        # os: [ubuntu-latest, macos-latest, windows-latest] # Pour inclure Linux

    runs-on: ${{ matrix.os }}
    steps:
      # 1. Récupérer le code du dépôt
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Utilisez la version que vous voulez

      # 3. Installer les dépendances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # Si vous avez un fichier requirements.txt, décommentez la ligne suivante :
          # pip install -r requirements.txt

      # 4. Construire l'exécutable avec PyInstaller
      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --name "Snake-Byte" --windowed main.py
          # Le flag --windowed empêche l'ouverture d'une console (pour une app graphique)
          # Le flag --onefile crée un unique fichier exécutable

      # 5. Renommer l'exécutable selon l'OS
      - name: Rename executable
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            mv dist/Snake-Byte.exe dist/Snake-Byte-Windows.exe
          elif [ "$RUNNER_OS" == "macOS" ]; then
            mv dist/Snake-Byte dist/Snake-Byte-macOS
          fi

      # 6. Télécharger l'exécutable comme artefact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Byte-${{ runner.os }}
          path: dist/Snake-Byte-*
