name: Build Snake Byte Executables

on:
  workflow_dispatch:  # Déclenchement manuel
  push:
    tags:
      - 'v*'           # Déclenchement automatique sur les tags

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        # os: [ubuntu-latest, macos-latest, windows-latest] # Optionnel : ajouter Linux
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # Pas besoin d'installer requirements.txt car il est vide !
      
      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --name "Snake-Byte" --windowed main.py
      
      - name: Rename executable by platform
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            mv dist/Snake-Byte.exe dist/Snake-Byte-Windows.exe
          elif [ "$RUNNER_OS" == "macOS" ]; then
            mv dist/Snake-Byte dist/Snake-Byte-macOS
          fi
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snake-Byte-${{ runner.os }}
          path: dist/Snake-Byte-*
